# For detailed configuration reference documentation, visit:
# https://supabase.com/docs/guides/local-development/cli/config
# Working directory for the GitHub integration is the repo root (`.`).
# Deploy to production applies supabase/migrations on push to main.
project_id = "stufe7"

[api]
enabled = true

[db]
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "https://localhost:5173",
  "https://stufe7.com",
  "https://stufe7.com/**",
  "https://www.stufe7.com",
  "https://www.stufe7.com/**",
]
enable_signup = true

[auth.email]
enable_signup = true
otp_length = 6
otp_expiry = 300

[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/hook_before_user_created"
